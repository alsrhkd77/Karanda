org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Kotlin 증분 컴파일 비활성화.
# pub 캐시(C:)와 빌드 디렉터리(E:)가 서로 다른 드라이브에 있으면 Kotlin이 증분 캐시의 경로를
# 상대화하지 못해(RelocatableFileToPathConverter) 캐시 기록에 실패한다. KGP 2.2까지는 경고였지만
# 2.4부터는 빌드 실패로 취급한다. 캐시가 저장되지 않아 증분의 이점이 없던 상태이므로 꺼도 손해가 없다.
kotlin.incremental=false
